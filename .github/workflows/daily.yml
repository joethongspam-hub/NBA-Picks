name: Daily NBA props

on:
  schedule:
    # 11:00 AM and 5:00 PM Central (standard time). The second run catches
    # late injury news and posted lines before most tip-offs.
    - cron: "0 17 * * *"
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      backtest_date:
        description: "Optional: backtest a past date (YYYY-MM-DD) and grade it vs real results"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: props
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: espn-${{ github.run_id }}
          restore-keys: espn-

      - name: Load the current site (NBA + NFL pages)
        run: |
          mkdir -p public
          if git fetch -q origin site-data; then git archive FETCH_HEAD | tar -x -C public; fi

      - name: Backtest a past date
        if: ${{ github.event.inputs.backtest_date != '' }}
        run: python -m nba_props.main --backtest "${{ github.event.inputs.backtest_date }}" --out public

      - name: Build today's picks
        env:
          # Pull real lines once a day (5 PM run + manual runs) to stay inside the
          # free tier's 500 credits/month.
          ODDS_API_KEY: ${{ github.event.schedule == '0 17 * * *' && '' || secrets.ODDS_API_KEY }}
          ODDS_MARKETS: ${{ vars.ODDS_MARKETS }}
        run: |
          python -m nba_props.main --out public --history history
          mkdir -p public/backtests
          cp backtests/*.html public/backtests/ 2>/dev/null || true

      - name: Save pick history (for the track record)
        run: |
          git config user.name "props-bot"
          git config user.email "props-bot@users.noreply.github.com"
          git add history backtests 2>/dev/null || git add history
          git diff --cached --quiet || git commit -m "picks $(date -u +%F)"
          git pull --rebase -q && git push

      - name: Save site
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd public && rm -rf .git && git init -q && git add -A
          git -c user.name=props-bot -c user.email=props-bot@users.noreply.github.com commit -qm "site $(date -u +%F)"
          git push -fq "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" HEAD:site-data

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
