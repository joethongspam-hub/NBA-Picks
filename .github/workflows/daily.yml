name: Daily NBA props

on:
  schedule:
    # Times are UTC. Games lock at tip-off, so later runs never touch started games.
    # UTC times, off the top of the hour (GitHub delays/drops busy-hour schedules).
    - cron: "47 16 * * *"    # ~10:45 AM CT: morning picks
    - cron: "17 21 * * *"    # ~3:15 PM CT: main pregame run (+ Odds API if NBA_ODDS=on)
    - cron: "43 23 * * *"    # ~5:45 PM CT: late injury news for games not yet started
    - cron: "33 6 * * *"     # ~12:30 AM CT: results only: grade the day's picks (no odds, no new picks)
  workflow_dispatch:
    inputs:
      results:
        description: "Results only: grade finished picks, no new picks or odds (yes/no)"
        required: false
        default: "no"
      notify:
        description: "Phone notification: no / yes (if picks changed) / test (always send)"
        required: false
        default: "no"
      backtest_date:
        description: "Optional: backtest a past date (YYYY-MM-DD) and grade it vs real results"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: props
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: espn-${{ github.run_id }}
          restore-keys: espn-

      - name: Load the current site (NBA + NFL pages)
        run: |
          mkdir -p public
          if git fetch -q origin site-data; then git archive FETCH_HEAD | tar -x -C public; fi
          cp public/picks.json /tmp/before_nba.json 2>/dev/null || true

      - name: Backtest a past date
        if: ${{ github.event.inputs.backtest_date != '' }}
        run: python -m nba_props.main --backtest "${{ github.event.inputs.backtest_date }}" --out public

      - name: Grade results (no odds, no new picks)
        if: ${{ github.event.schedule == '33 6 * * *' || github.event.inputs.results == 'yes' }}
        run: python -m nba_props.main --results-only --out public --history history --notify-out notify.json

      - name: Build today's picks
        if: ${{ !(github.event.schedule == '33 6 * * *' || github.event.inputs.results == 'yes') }}
        env:
          # DraftKings lines come free from ESPN on every run. The Odds API (multi-book
          # consensus, costs credits) is optional: set repo variable NBA_ODDS=on to use it
          # once a day on the 3:30 PM run.
          ODDS_API_KEY: ${{ vars.NBA_ODDS == 'on' && (github.event_name == 'workflow_dispatch' || github.event.schedule == '17 21 * * *') && secrets.ODDS_API_KEY || '' }}
          ODDS_MARKETS: ${{ vars.ODDS_MARKETS }}
        run: |
          python -m nba_props.main --out public --history history
          mkdir -p public/backtests
          cp backtests/*.html public/backtests/ 2>/dev/null || true

      - name: Save pick history (for the track record)
        run: |
          git config user.name "props-bot"
          git config user.email "props-bot@users.noreply.github.com"
          git add history backtests 2>/dev/null || git add history
          git diff --cached --quiet || git commit -m "picks $(date -u +%F)"
          git pull --rebase -q && git push

      - name: Prepare phone notification
        if: ${{ !(github.event.schedule == '33 6 * * *' || github.event.inputs.results == 'yes') && (github.event_name == 'schedule' || github.event.inputs.notify == 'yes' || github.event.inputs.notify == 'test') }}
        run: |
          python -m nba_props.notify --sport NBA --before /tmp/before_nba.json --after public/picks.json \
            --url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" \
            --out notify.json ${{ github.event.inputs.notify == 'test' && '--force' || '' }} || true

      - uses: actions/upload-artifact@v4
        with:
          name: notify
          path: notify.json
          if-no-files-found: ignore

      - name: Save site
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd public && rm -rf .git && git init -q && git add -A
          git -c user.name=props-bot -c user.email=props-bot@users.noreply.github.com commit -qm "site $(date -u +%F)"
          git push -fq "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" HEAD:site-data

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  notify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: notify
        continue-on-error: true
      - name: Send to phone (ntfy)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          pip install -q requests
          python -m nba_props.notify --send-json notify.json \
            --url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" || true
