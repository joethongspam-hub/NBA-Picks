name: Daily NBA props

on:
  schedule:
    # 11:00 AM and 5:00 PM Central (standard time). The second run catches
    # late injury news and posted lines before most tip-offs.
    - cron: "0 17 * * *"
    - cron: "0 23 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: props
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: espn-${{ github.run_id }}
          restore-keys: espn-

      - name: Build today's picks
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -m nba_props.main --out site --history history

      - name: Save pick history (for the track record)
        run: |
          git config user.name "props-bot"
          git config user.email "props-bot@users.noreply.github.com"
          git add history
          git diff --cached --quiet || git commit -m "picks $(date -u +%F)"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
