name: Season backtest

on:
  workflow_dispatch:
    inputs:
      start:
        description: "First date (YYYY-MM-DD)"
        required: true
        default: "2026-10-15"
      end:
        description: "Last date (YYYY-MM-DD)"
        required: true
        default: "2026-10-30"

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Backtest every night in range
        run: python -m nba_props.main --backtest-range "${{ inputs.start }}" "${{ inputs.end }}" --out site
      - name: Commit backtest results
        run: |
          git config user.name "props-bot"
          git config user.email "props-bot@users.noreply.github.com"
          git add backtests
          git diff --cached --quiet || git commit -m "season backtest ${{ inputs.start }}..${{ inputs.end }}"
          git pull --rebase -q && git push
      - name: Save raw data snapshot (for offline model tuning)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tar czf /tmp/cache.tgz .cache
          mkdir /tmp/snap && cd /tmp/snap && git init -q && cp /tmp/cache.tgz .
          git config user.name "props-bot" && git config user.email "props-bot@users.noreply.github.com"
          git add . && git commit -qm "data snapshot $(date -u +%F)"
          git push -fq "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" HEAD:data-snapshot
