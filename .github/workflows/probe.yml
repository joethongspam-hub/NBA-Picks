name: Probe ESPN prop lines

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python tools/probe_espn_props.py
      - name: Save results
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir /tmp/p && cp probe.json /tmp/p/ && cd /tmp/p && git init -q && git add .
          git -c user.name=props-bot -c user.email=props-bot@users.noreply.github.com commit -qm probe
          git push -fq "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" HEAD:probe-results
